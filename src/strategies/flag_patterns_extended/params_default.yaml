# the Quick default “starter” config

# Pole (ATR-normalized)
pole_method: atr_normalized
pole_lookback_k: 5
atr_len: 14
pole_score_min: 3.0

# Consolidation
min_consolidation_bars: 5
max_consolidation_bars: 16
max_retrace_ratio: 0.40
median_close_above: null   # optional; e.g., 0.20 of pole height

# Flags (parallel)
parallel_angle_max_deg: 8
channel_slope_cap_deg: 12
min_touches_per_line: 2

# Pennants (converging)
width_shrink_ratio_max: 0.60
apex_pos_factor_max: 2.0

# Breakout & execution
breakout_requires_close: true
breakout_buffer_atr: 0.05
max_wait_bars_after_consolidation: 5
entry_type: next_open        # {close,next_open}
stop_offset_atr: 0.25
target_type: measured_move   # {measured_move,atr_multiple}
measured_move_factor: 1.0
atr_target_k: 2.0            # used if target_type=atr_multiple

# Pivots (structure resolution)
pivot_method: PIP            # {PIP,DirectionalChange}
pip_order: 8
dc_epsilon_atr_mult: null    # e.g., 0.3 -> 0.3*ATR if using DC

# Boundary fitting (pip_order influence)
boundary_fit_mode: pivots    # {bars,pivots}
pivot_price_for_fit: hl2     # {close,hl2,ohlc4}
min_pivot_points_per_line: 2

# Filters (optional; set to null/false to skip)
vol_dryup_ratio_max: 0.80        # mean(vol flag)/mean(vol pole) <= 0.8
vol_expansion_mult_min: 1.60     # breakout vol >= 1.6 * MA(vol, L)
vol_ma_len: 20
adx_len: 14
adx_min: 25
ma_len: 50
ma_slope_min: 0.0                 # > 0 means upward slope

# Backtest hygiene
slippage_bps: 5                   # conservative baseline for crypto taker-style fills
commission_bps: 10                # conservative baseline for crypto taker-style fills
event_purge_bars: 20
embargo_bars: 10

# Filters toggle
enable_filters: false
